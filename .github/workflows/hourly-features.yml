name: Hourly - Feature Collection

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - run: |
          mkdir -p data/features
          python3 << 'CODE'
import os
import pandas as pd
import requests
from datetime import datetime
import time

print('Fetching Bitcoin features...')

# Retry logic for API rate limiting
max_retries = 3
for attempt in range(max_retries):
    try:
        print(f'Attempt {attempt + 1}/{max_retries}...')
        url = 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart'
        resp = requests.get(url, params={'vs_currency': 'usd', 'days': '365', 'interval': 'daily'}, timeout=10)
        resp.raise_for_status()
        
        prices = resp.json().get('prices', [])
        if prices:
            df = pd.DataFrame(prices, columns=['timestamp', 'price'])
            df['timestamp'] = pd.to_datetime(df['timestamp'], unit='ms')
            
            ts = datetime.utcnow().strftime('%Y%m%d_%H%M%S')
            path = f'data/features/btc_features_{ts}.csv'
            df.to_csv(path, index=False)
            print(f'✅ Saved {len(df)} records to {path}')
            break
        else:
            print('No data received')
            if attempt < max_retries - 1:
                time.sleep(5)
            else:
                exit(1)
    except Exception as e:
        print(f'⚠️ Error: {e}')
        if attempt < max_retries - 1:
            wait = 5 * (2 ** attempt)
            print(f'Retrying in {wait}s...')
            time.sleep(wait)
        else:
            print(f'❌ Failed after {max_retries} attempts')
            exit(1)
CODE
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A || true
          git commit -m "Hourly features" || true
          git push || true

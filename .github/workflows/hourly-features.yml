name: Hourly - Feature Data Collection

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-hourly-features:
    name: Fetch Bitcoin Features Every Hour
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests

      - name: Fetch Bitcoin features
        run: python3 << 'EOF'
import os
import sys
import pandas as pd
from datetime import datetime

print('=' * 60)
print('HOURLY FEATURE COLLECTION')
print('=' * 60)

import requests
try:
    url = 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart'
    params = {
        'vs_currency': 'usd',
        'days': '365',
        'interval': 'daily'
    }
    response = requests.get(url, params=params, timeout=10)
    response.raise_for_status()
    
    data = response.json()
    prices = data.get('prices', [])
    
    if prices:
        df = pd.DataFrame(prices, columns=['timestamp', 'price'])
        df['timestamp'] = pd.to_datetime(df['timestamp'], unit='ms')
        
        os.makedirs('data/features', exist_ok=True)
        
        timestamp = datetime.utcnow().strftime('%Y%m%d_%H%M%S')
        output_path = f'data/features/btc_features_{timestamp}.csv'
        df.to_csv(output_path, index=False)
        
        print(f'[OK] Features saved: {output_path}')
        print(f'Records: {len(df)}')
    else:
        print("[ERROR] No data")
        exit(1)

except Exception as e:
    print(f'[ERROR] {e}')
    exit(1)

print('[OK] COMPLETE')
EOF

      - name: Commit and push
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A || true
          git commit -m "Hourly features update" || true
          git push || true

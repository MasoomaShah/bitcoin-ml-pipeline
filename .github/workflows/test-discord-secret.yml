name: Test Discord Secret

on:
  workflow_dispatch:

jobs:
  test-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check if DISCORD_WEBHOOK secret exists
        run: |
          if [ -z "${{ secrets.DISCORD_WEBHOOK }}" ]; then
            echo "❌ DISCORD_WEBHOOK secret is NOT set"
            echo ""
            echo "To fix:"
            echo "1. Go to your GitHub repo"
            echo "2. Settings → Secrets and variables → Actions"
            echo "3. Click 'New repository secret'"
            echo "4. Name: DISCORD_WEBHOOK"
            echo "5. Value: (paste your Discord webhook URL)"
            echo "6. Click 'Add secret'"
            exit 1
          else
            echo "✅ DISCORD_WEBHOOK secret is SET"
          fi

      - name: Test sending Discord message
        if: success()
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "username": "Bitcoin ML Pipeline",
              "avatar_url": "https://bitcoin.org/img/icons/logo.png",
              "embeds": [
                {
                  "title": "✅ Discord Webhook Test",
                  "description": "Your DISCORD_WEBHOOK secret is properly configured!",
                  "color": 3066993,
                  "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                }
              ]
            }'
        continue-on-error: true

name: Hourly - Model Training

on:
  schedule:
    # Run every hour at :00
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  hourly-training:
    name: Hourly Model Training
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q pandas numpy scikit-learn requests xgboost

      - name: Fetch latest Bitcoin data
        run: |
          python << 'EOF'
import pandas as pd
import requests
import json
from datetime import datetime

print('📊 Fetching latest Bitcoin data...')
url = 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart'
params = {'vs_currency': 'usd', 'days': '365', 'interval': 'daily'}

try:
    response = requests.get(url, params=params, timeout=30)
    response.raise_for_status()
    
    data = response.json()
    prices = data.get('prices', [])
    volumes = data.get('total_volumes', [])
    market_caps = data.get('market_caps', [])
    
    df = pd.DataFrame({
        'date': pd.to_datetime([p[0] for p in prices], unit='ms'),
        'price': [p[1] for p in prices],
        'volume': [v[1] if i < len(volumes) else 0 for i, v in enumerate(volumes)],
        'market_cap': [m[1] if i < len(market_caps) else 0 for i, m in enumerate(market_caps)]
    })
    
    print(f'✅ Fetched {len(df)} records')
    print(f'   Latest price: ${df["price"].iloc[-1]:.2f}')
    df.to_csv('data/raw/bitcoin_timeseries.csv', index=False)
    
except Exception as e:
    print(f'❌ Error: {e}')
    exit(1)
EOF

      - name: Train models
        run: |
          python << 'EOF'
import pandas as pd
import numpy as np
from sklearn.model_selection import train_test_split
from sklearn.ensemble import RandomForestClassifier, RandomForestRegressor
from sklearn.metrics import accuracy_score, f1_score, mean_squared_error, r2_score
import joblib
from datetime import datetime
import os

print('🔧 Training models...')

# Load data
df = pd.read_csv('data/raw/bitcoin_timeseries.csv')
print(f'✓ Loaded {len(df)} records')

# Generate features
price = df['price'].values
features = np.column_stack([
    price.rolling(3).mean(),
    price.rolling(7).mean(),
    price.rolling(14).mean(),
    np.diff(price, prepend=price[0]) / (price + 1e-8),
    np.diff(price, 3, prepend=price[:3]) / (price + 1e-8),
    df['volume'].values
]).fillna(0)

features = features[14:]  # Remove NaN rows
price_clean = price[14:]

# Create targets
y_reg = np.diff(price_clean)
y_clf = (y_reg > 0).astype(int)
X = features[:-1]
y_reg = y_reg
y_clf = y_clf

# Split data
X_train, X_test, y_train_reg, y_test_reg, y_train_clf, y_test_clf = train_test_split(
    X, y_reg, y_clf, test_size=0.2, random_state=42
)

# Train regression model
print('  Training RandomForest Regression...')
rf_reg = RandomForestRegressor(n_estimators=100, max_depth=10, random_state=42, n_jobs=-1)
rf_reg.fit(X_train, y_train_reg)
reg_rmse = np.sqrt(mean_squared_error(y_test_reg, rf_reg.predict(X_test)))
reg_r2 = r2_score(y_test_reg, rf_reg.predict(X_test))
print(f'  ✓ Regression - RMSE: {reg_rmse:.4f}, R²: {reg_r2:.4f}')

# Train classification model
print('  Training RandomForest Classification...')
rf_clf = RandomForestClassifier(n_estimators=100, max_depth=10, random_state=42, n_jobs=-1)
rf_clf.fit(X_train, y_train_clf)
clf_acc = accuracy_score(y_test_clf, rf_clf.predict(X_test))
clf_f1 = f1_score(y_test_clf, rf_clf.predict(X_test), average='weighted')
print(f'  ✓ Classification - Accuracy: {clf_acc:.4f}, F1: {clf_f1:.4f}')

# Save models
os.makedirs('models', exist_ok=True)
ts = datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
joblib.dump(rf_reg, f'models/{ts}_regression.pkl')
joblib.dump(rf_clf, f'models/{ts}_classification.pkl')

# Save metadata
metadata = {
    'timestamp': ts,
    'regression': {'rmse': float(reg_rmse), 'r2': float(reg_r2)},
    'classification': {'accuracy': float(clf_acc), 'f1': float(clf_f1)},
    'training_samples': len(X_train),
    'test_samples': len(X_test),
    'features': 6
}

with open(f'models/{ts}_metadata.json', 'w') as f:
    import json
    json.dump(metadata, f, indent=2)

print(f'\n✅ Models trained and saved at {ts}')
EOF

      - name: Commit and push models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/ models/ 2>/dev/null || true
          git commit -m "chore: hourly model training $(date -u +%Y-%m-%d_%H:%M:%S)" || echo "No changes"
          git push origin main || echo "Nothing to push"

      - name: Notify success
        run: |
          echo "✅ Hourly training completed"
          echo "📊 Models saved to: models/"
